services:
  api:
    image: node:22-bookworm-slim
    user: "${PAWHUB_UID}:${PAWHUB_GID}"
    working_dir: /app
    # server-nest is the real app now: it mounts the legacy server/src/app.js internally for
    # anything not yet migrated (see server-nest/src/legacy-gateway.ts), same as production's
    # deploy/pawhub.service. Run `npm ci && npm run build -w server-nest` on the host before
    # `docker compose up` — this image has no build step of its own, it just runs the host's
    # already-built checkout read-only (see the `.:/app:ro` mount below).
    command: ["node", "server-nest/dist/main.js"]
    env_file:
      - .env.preview
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - .:/app:ro
      - ./server/data/photos:/data/photos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
