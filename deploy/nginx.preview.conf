# PAWHUB WIX BACKUP BEGIN
server {
    listen 80;
    server_name backup.pawhub.co.nz;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / { return 308 https://backup.pawhub.co.nz$request_uri; }
}
server {
    listen 443 ssl;
    server_name backup.pawhub.co.nz;
    ssl_certificate /etc/letsencrypt/live/backup.pawhub.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.pawhub.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location / {
        proxy_pass http://pawhub-wix-backup:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
# PAWHUB WIX BACKUP END

# PAWHUB PUBLIC WEBSITE
server {
    listen 80;
    server_name pawhub.co.nz www.pawhub.co.nz;
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name pawhub.co.nz www.pawhub.co.nz;
    ssl_certificate /etc/letsencrypt/live/pawhub.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pawhub.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    location = /api/contact {
        client_max_body_size 16k;
        proxy_pass http://pawhub-contact:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }
    location / {
        proxy_pass http://pawhub-wix-backup:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
