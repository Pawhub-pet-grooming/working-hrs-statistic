server {
    listen 80;
    server_name 15.135.80.230 _;
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve the React download page with language selection and live APK metadata.
    location = /appdownload {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }
    location = /appdownload/ {
        return 302 /appdownload;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name signin.pawhub.co.nz;
    root /usr/share/nginx/html;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://signin.pawhub.co.nz$request_uri; }
}

server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/signin.pawhub.co.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signin.pawhub.co.nz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name signin.pawhub.co.nz;
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve the React download page with language selection and live APK metadata.
    location = /appdownload {
        try_files /index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }
    location = /appdownload/ {
        return 302 /appdownload;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

