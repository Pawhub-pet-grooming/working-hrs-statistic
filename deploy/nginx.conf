# Replace api.example.com and configure HTTPS via Certbot before production use.
server {
    listen 80;
    server_name api.example.com;
    client_max_body_size 6m;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # Swagger UI and its OpenAPI JSON (server-nest's src/main.ts) — the frontend integration
    # contract doc. Outside /api/ on purpose (server-nest's own paths, not proxied through the
    # legacy gateway's /api/v1 prefix), so it needs its own location block or this proxy never
    # sees the request and nginx 404s it.
    location /docs {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
